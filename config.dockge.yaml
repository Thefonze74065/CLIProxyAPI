# Configuration for CLIProxyAPI hub on TrueNAS (Dockge stack)
# Based on: https://gist.github.com/t3dotgg/59a521d2ee8d70aaf90e280c175072af
#
# Place this file in your Dockge stack directory as config.yaml
# and customize the access.api-keys and management.secret-key values.

config-version: 8

# Listener, TLS, network discovery, and server operation.
server:
  # Bind to all interfaces so Tailscale clients and LAN can reach us.
  host: ""

  # Server port (standard CLIProxyAPI port).
  port: 8317

  # Maximum allowed size (in bytes) for incoming HTTP request bodies.
  max-request-body-bytes: 0

  # Negotiated compression of downstream HTTP responses.
  response-compression:
    enabled: true
    min-bytes: 1024

  # Global token for GitHub requests (optional).
  github-token: ""

  # IP addresses or CIDRs of proxies allowed to supply forwarded client IP headers.
  # If you're behind Tailscale serve or a reverse proxy, add its IP here.
  trusted-proxies: []

  # TLS disabled — Tailscale serve handles HTTPS termination.
  tls:
    enable: false
    cert: ""
    key: ""

  commercial-mode: false

  discovery:
    enabled: false

  kv-store:
    disabled: false
    path: ""

# Management API settings
management:
  # Allow remote access from Tailscale/LAN (not just localhost)
  allow-remote: true

  # Management key — set a strong password for the management API
  secret-key: "change-me-to-a-strong-management-key"

  disable-control-panel: false
  base-url: "http://127.0.0.1:8317"

# Client authentication for the proxy API.
# These are the keys your clients (Claude Code, Codex, T3 Code) will use.
access:
  api-keys:
    - "your-access-key-1"
    - "your-access-key-2"
    - "your-access-key-3"

